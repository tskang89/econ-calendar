name: (일회용) Destatis 차단 시험

# Destatis 가 GitHub 러너에서 403 을 돌려준다. 프랑크푸르트 사무소 회선에서는
# 같은 주소가 200 이다 — 요청 모양이 아니라 IP 쪽일 수 있다. 어떤 변형이면
# 통과하는지 러너에서 직접 본다. 결과를 보고 지운다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 나가는 IP
        run: curl -s --max-time 20 https://api.ipify.org || true

      - name: 변형별 시도
        run: |
          U='https://www.destatis.de/SiteGlobals/Forms/Suche/Termine/DE/Terminsuche_Formular.html?nn=250582'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'

          try () {
            printf '%-22s ' "$1"; shift
            curl -s -o /tmp/d.html -w '%{http_code} %{size_download}B\n' --max-time 25 "$@" "$U" || echo "(실패)"
          }

          try "UA 만"            -H "User-Agent: $UA"
          try "헤더 없음"
          try "브라우저 전체"      -H "User-Agent: $UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: de-DE,de;q=0.9,en;q=0.8' \
              -H 'Upgrade-Insecure-Requests: 1' \
              -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' \
              -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-User: ?1'
          try "쿠키 선취득"       -H "User-Agent: $UA" -c /tmp/c.txt -b /tmp/c.txt \
              -H 'Accept-Language: de-DE,de;q=0.9'
          try "HTTP/1.1 강제"     --http1.1 -H "User-Agent: $UA"
          try "curl 기본 UA"      -A 'curl/8.5.0'

          echo "--- 마지막 응답 앞 300자 ---"
          head -c 300 /tmp/d.html; echo

      - name: 영문 주소도 보기
        run: |
          curl -s -o /dev/null -w 'EN %{http_code}\n' --max-time 25 \
            -H 'User-Agent: Mozilla/5.0' \
            'https://www.destatis.de/EN/Service/Dates/_node.html' || true
          curl -s -o /dev/null -w 'root %{http_code}\n' --max-time 25 \
            -H 'User-Agent: Mozilla/5.0' 'https://www.destatis.de/' || true
