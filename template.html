<!doctype html><html lang="ko"><head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주요 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5;
  --ink:#101a26; --ink-2:#465264; --muted:#768194;
  --rule:#dce1e8; --rule-strong:#b9c1cc;
  --accent:#163f8c; --accent-soft:#e3eaf7;
  --hot:#b4332f; --hot-soft:#fbe9e8;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e131a; --surface:#151c25; --surface-2:#1c2530;
    --ink:#edf1f6; --ink-2:#b2bcc9; --muted:#8793a3;
    --rule:#26303c; --rule-strong:#3a4656;
    --accent:#8fb0ff; --accent-soft:#1d2a44;
    --hot:#ef7b76; --hot-soft:#3a2120;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131a; --surface:#151c25; --surface-2:#1c2530;
  --ink:#edf1f6; --ink-2:#b2bcc9; --muted:#8793a3;
  --rule:#26303c; --rule-strong:#3a4656;
  --accent:#8fb0ff; --accent-soft:#1d2a44;
  --hot:#ef7b76; --hot-soft:#3a2120;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}
header{padding:26px 0 14px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(22px,5vw,28px);line-height:1.2;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.stamp{font-size:12.5px;color:var(--ink-2)}
.stamp a{color:var(--accent)}
/* 차트팩의 머리글 링크와 같은 꼴로 둔다. 두 페이지를 오가는 링크가
   서로 다르게 보이면 같은 자리에 있는 같은 것으로 읽히지 않는다. */
.stamp a.calLink{color:var(--accent);text-decoration:none;font-weight:600}
.stamp a.calLink:hover{text-decoration:underline}

.day{margin-top:22px}
.day h2{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:baseline;gap:8px;
  border-bottom:1px solid var(--rule-strong);padding-bottom:6px}
.day h2 .d{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink)}
.day h2 .w{font-size:12.5px;color:var(--muted)}
/* 오늘은 한눈에 걸려야 한다. 한 달 치가 깔리면 날짜 머리글이 스무 개
   넘게 늘어서는데, 글자 색만 바꿔 두면 훑는 눈에 걸리지 않는다. 그래서
   그 하루만 통째로 띠를 두르고 왼쪽에 굵은 선을 세운다. */
.day.today{background:var(--accent-soft);border-left:4px solid var(--accent);
  border-radius:10px;padding:10px 12px 12px;margin-left:-16px;margin-right:-16px;
  padding-left:12px}
.day.today h2{border-bottom-color:var(--accent);color:var(--accent)}
.day.today h2 .d{color:var(--accent);font-weight:700;font-size:18px}
.day.today h2 .w{color:var(--accent)}
.day.today h2::after{content:"오늘";font-size:11px;font-weight:700;color:#fff;
  background:var(--accent);border-radius:999px;padding:2px 9px;margin-left:auto;
  letter-spacing:.02em}
/* 띠 안에서는 항목 카드가 흰 배경이라 그대로 두면 떠 보인다. */
.day.today li{border-color:var(--accent);
  box-shadow:0 1px 2px rgba(22,63,140,.08)}

/* 지나간 날. 빌드가 하루 늦게 돌면 어제가 맨 위에 남는데, 지워 버리면
   '무슨 일이 있었는지'가 사라지므로 흐리게만 둔다. */
.day.past{opacity:.45}
.day.past h2::after{content:"지남";font-size:10.5px;font-weight:600;
  color:var(--muted);background:var(--surface-2);border-radius:999px;
  padding:1px 7px;margin-left:auto}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
li.policy{border-color:var(--hot);background:var(--hot-soft)}
/* 행사는 배경이다. 발표 일정과 성격이 달라 한눈에 갈려야 하지만,
   통화정책처럼 눈에 띄면 안 된다 — 점선 테두리로만 구분한다. */
li.event{border-style:dashed}
li.event .tag{background:var(--surface-2);color:var(--muted)}
li.event .who{color:var(--muted)}
li.major .what{font-weight:600;color:var(--ink)}
li.major:not(.policy){border-color:var(--rule-strong);box-shadow:inset 3px 0 0 var(--accent)}
.tag{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;
  border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);
  white-space:nowrap;margin-top:1px}
li.policy .tag{background:var(--hot);color:#fff}
.body{min-width:0}
.who{font-weight:600}
.what{color:var(--ink-2)}
a.src{color:inherit;text-decoration:none}
a.src:hover .who{text-decoration:underline}

.empty{background:var(--surface);border:1px dashed var(--rule-strong);border-radius:10px;
  padding:14px;color:var(--muted);text-align:center}
.note{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink-2)}
.note ul{display:block;list-style:disc;padding-left:18px;margin:6px 0 0}
.note li{display:list-item;background:none;border:0;padding:0;color:inherit}
.warn{margin-top:14px;background:var(--hot-soft);border:1px solid var(--hot);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
</style></head><body>
<div class="wrap">
<header>
  <p class="eyebrow">Month ahead</p>
  <h1>향후 1개월 주요 일정</h1>
  <p class="stamp">__STAMP__</p>
</header>
__DAYS__
__WARN__
<div class="note">__NOTE__</div>
</div>
<!-- 빌드가 스스로 남기는 기록. 화면에는 나오지 않는다.
     주간 자체 점검이 읽어 '표가 말라 가는가'를 본다. 독자용 정보가 아니다. -->
<script id="ops" type="application/json">__OPS__</script>

<script>
/* 오늘을 보는 사람의 시계로 다시 매긴다.
 *
 * 빌드는 평일 한 번 도는데 GitHub 예약이 여섯 시간쯤 밀린다. 조간 브리핑은
 * 08:00 에 나가고 이 페이지는 13시께 다시 만들어지니, 아침에 링크를 누르면
 * 전날 판이 보인다. 빌드 시점의 '오늘'이 박혀 있으면 어제가 오늘로 강조된다.
 * 실제로 10월 1일 아침에 9월 30일이 '오늘'이었다.
 *
 * 그래서 서버가 붙인 표시를 걷고 브라우저의 날짜로 다시 붙인다. 자바스크립트가
 * 막힌 데서는 서버가 붙인 것이 그대로 남아 하루 어긋나는 선에서 멈춘다 —
 * 아무 표시도 없는 것보다 낫다.
 *
 * 날짜는 현지 시각으로 센다. toISOString() 은 UTC 로 바꿔 버려서 베를린
 * 자정~새벽 두 시에 하루 앞의 날짜를 준다.
 */
(function () {
  var days = document.querySelectorAll('section.day[data-date]');
  if (!days.length) return;

  var n = new Date();
  var pad = function (v) { return (v < 10 ? '0' : '') + v; };
  var today = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());

  var hit = null;
  days.forEach(function (el) {
    var d = el.getAttribute('data-date');
    el.classList.remove('today', 'past');
    if (d === today) { el.classList.add('today'); hit = el; }
    else if (d < today) { el.classList.add('past'); }
  });

  /* 오늘 일정이 없는 날도 있다(주말·휴일). 그때는 아무것도 강조하지 않는다 —
     없는 날을 억지로 만들면 '오늘 이것이 있다'로 읽힌다. */
  if (!hit) return;

  /* 지나간 날이 앞에 쌓여 있으면 오늘이 화면 밖에 있다. 거기로 옮겨 준다.
     스크롤 위치를 건드리는 것이라 조용히, 애니메이션 없이 한다. */
  var past = document.querySelectorAll('section.day.past').length;
  if (past > 0 && hit.getBoundingClientRect().top > window.innerHeight * 0.8) {
    hit.scrollIntoView({ block: 'start' });
  }
})();
</script>
</body></html>
